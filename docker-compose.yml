services:

  # Base de datos PostgreSQL
  database:
    build: ./Database
    container_name: yahoo_database
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - database_volume:/var/lib/postgresql/data
      - dataset_volume:/data
      - ./Database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - yahoo_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  descarga-dataset:
    build: ./Descarga_Dataset
    container_name: yahoo_descarga_dataset
    profiles: ["manual"]
    volumes:
      - dataset_volume:/data
      - ./local_data:/data
    environment:
      - KAGGLE_USERNAME=${KAGGLE_USERNAME}
      - KAGGLE_KEY=${KAGGLE_KEY}
    networks:
      - yahoo_network
    depends_on:
      database:
        condition: service_healthy

  cache:
    image: redis:7-alpine
    container_name: yahoo_cache
    command: redis-server --maxmemory 52428800 --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    networks:
      - yahoo_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  cache-manager:
    build: ./Cache
    container_name: yahoo_cache_manager
    profiles: ["manual"]
    environment:
      - REDIS_HOST=cache
    depends_on:
      cache:
        condition: service_healthy
    networks:
      - yahoo_network

  pruebas:
    build: ./LLM_Client
    container_name: Contestador_Base
    profiles: ["manual"]
    volumes:
      - ./LLM_Client:/app
      - ./local_data:/data
    env_file:
      - .env
    networks:
      - yahoo_network

  generador-trafico:
    build: ./Generador_Trafico
    container_name: yahoo_generador_trafico
    volumes:
      - ./local_data:/data
      - ./Generador_Trafico:/app
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - yahoo_network

  llm-client:
    build:
      context: ./prueba
    container_name: API_CLIENT
    volumes:
      - ./prueba:/app
      - ./local_data:/data
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    restart: "no"
    networks:
      - yahoo_network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: yahoo_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - yahoo_network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: yahoo_kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    networks:
      - yahoo_network
    volumes:
      - ./kafka-init.sh:/usr/local/bin/kafka-init.sh
    command: ["/bin/bash", "-c", "(/usr/local/bin/kafka-init.sh &) && /etc/confluent/docker/run"]


  flink-jobmanager:
    image: flink:1.19-scala_2.12
    container_name: yahoo_flink_jobmanager
    profiles: ["manual"]   
    command: jobmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
    ports:
      - "8081:8081"
    networks:
      - yahoo_network

  flink-taskmanager:
    image: flink:1.19-scala_2.12
    container_name: yahoo_flink_taskmanager
    profiles: ["manual"]   
    command: taskmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
    depends_on:
      - flink-jobmanager
    networks:
      - yahoo_network

  flink-reprocessor:
    build: ./FlinkReprocessor
    profiles: ["manual"]   
    container_name: flink_reprocessor
    depends_on:
      - kafka
    networks:
      - yahoo_network
# ---------------------------
  # HADOOP: NameNode / DataNode
  # ---------------------------
  hadoop-namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: hadoop_namenode
    environment:
      - CLUSTER_NAME=yahoo_hadoop
      - CORE_CONF_fs_defaultFS=hdfs://hadoop-namenode:9000
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
      - dataset_volume:/data   # compartir volumen con Postgres export
    ports:
      - "9000:9000"
      - "9870:9870"   # NameNode UI
    networks:
      - yahoo_network
    healthcheck:
      test: ["CMD-SHELL", "hdfs dfs -ls / >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  hadoop-datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: hadoop_datanode
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://hadoop-namenode:9000
      - HDFS_CONF_dfs_replication=1
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    depends_on:
      - hadoop-namenode
    networks:
      - yahoo_network

  resourcemanager:
    image: bde2020/hadoop-resourcemanager:2.0.0-hadoop3.2.1-java8
    container_name: hadoop_resourcemanager
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://hadoop-namenode:9000
    depends_on:
      - hadoop-namenode
    ports:
      - "8088:8088"   # YARN UI
    networks:
      - yahoo_network

  nodemanager:
    image: bde2020/hadoop-nodemanager:2.0.0-hadoop3.2.1-java8
    container_name: hadoop_nodemanager
    depends_on:
      - resourcemanager
      - hadoop-datanode
    networks:
      - yahoo_network

  # ---------------------------
  # Pig runner (contiene Apache Pig)
  # ---------------------------
  pig:
    build: ./Pig
    container_name: yahoo_pig
    volumes:
      - ./pig-scripts:/pig-scripts
      - dataset_volume:/data
      - ./scripts:/scripts
    depends_on:
      - hadoop-namenode
      - hadoop-datanode
    networks:
      - yahoo_network
    tty: true
volumes:
  dataset_volume:
    driver: local
  database_volume:
    driver: local
  hadoop_namenode:
  hadoop_datanode:
networks:
  yahoo_network:
    driver: bridge
